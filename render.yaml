services:
  - type: web
    name: nowro-korea
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: nowro-data
      mountPath: /var/data/nowro
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEPLOYMENT_MODE
        value: public-demo
      - key: ENABLE_LOCAL_OPERATOR_PREVIEW
        value: false
      - key: DATA_DIR
        value: /var/data/nowro
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      # Set to the service's final HTTPS URL, then match Supabase Auth Site URL.
      - key: PUBLIC_APP_URL
        sync: false
      - key: ANDROID_APP_ID
        sync: false
      - key: ANDROID_SHA256_FINGERPRINTS
        sync: false
