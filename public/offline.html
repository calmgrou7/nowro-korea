<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#172026" />
    <title>NOWRO — Connection needed</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f7faf5;
        color: #172026;
        font:
          16px/1.6 system-ui,
          sans-serif;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 420px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.2;
      }
      button {
        background: #c5f542;
        color: #172026;
        border: 0;
        border-radius: 14px;
        min-height: 48px;
        padding: 12px 24px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      p[lang] {
        color: #52605a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Let’s reconnect.</h1>
      <p>
        Connect to Wi-Fi or mobile data to use NOWRO. Sign-in, stamp
        verification and reward requests need an internet connection.
      </p>
      <p lang="ko">
        인터넷 연결을 확인해 주세요. 로그인, 스탬프 검증과 보상 신청은
        온라인에서 이용할 수 있습니다.
      </p>
      <button onclick="location.reload()">Try again / 다시 연결</button>
    </main>
  </body>
</html>
